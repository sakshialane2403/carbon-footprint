spring.application.name=carbon-footprint-system

server.port=9090

# ---------- PostgreSQL Configuration ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/carbon_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---------- Hibernate / JPA Configuration ----------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- Mail Configuration ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# HMAC key must be at least 32 characters (256-bit)
jwt.secret=carbon-footprint-jwt-secret-key-change-me-32chars
jwt.expiration=86400000

admin.default.username=admin
admin.default.password=Admin@123
